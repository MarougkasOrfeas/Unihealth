# Build
build.version=@project.version@
# Datasource
tenants.location=classpath:db/tenants/local
schema.validation=true
datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
# Liquibase
spring.liquibase.enabled=false
spring.liquibase.changeLog=classpath:/db/changelog/db.changelog-master.xml
# Servlet
server.servlet.context-path=/api
# Authentication
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/keycloak/realms/unihealth/protocol/openid-connect/certs
unihealth.security.jwt.expected-issuer=http://localhost:4200/keycloak/realms/unihealth
# OpenAPI
springdoc.api-docs.enabled=false
# Keycloak service authentication
keycloak.server-url=http://localhost:8081/keycloak
keycloak.realm-master=master
keycloak.realm-unihealth=unihealth
keycloak.client-id=admin-cli
keycloak.username=admin
keycloak.password=admin
unihealth.app.jobs.users.deactivate.cron=0 0 0 * * *
unihealth.app.jobs.users.deactivate.inactivity.days=395
unihealth.app.jobs.users.inform.inactivity.days=365
unihealth.app.users.deactivate.reactivated.after.days=21
unihealth.app.users.delete.unverified.after.days=21
unihealth.app.jobs.mail.send.cron=*/5 * * * * *
unihealth.app.jobs.mail.cleanup.cron=0 0 1 ? * SAT
# Mail
spring.mail.max_tries=3
spring.mail.debug=false
spring.mail.polling=true
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.auth=false
spring.mail.from=noreply@unihealth.gr
spring.mail.from-display-name=UNIHEALTH
# spring.mail.username = dev_username
# spring.mail.password = dev_password
unihealth.app.www.url=http://www.unihealth.gr
# RSS FEED
# Preference-governed notification emails (Profile > Preferences)
unihealth.app.jobs.notifications.optional-form-reminder.cron=0 0 9 * * *
unihealth.app.jobs.notifications.news-digest.cron=0 0 9 * * MON
unihealth.app.rss.jobs.refresh.cron=0 0 8 * * *
app.rss.sources[0].name=myfitnesspal
app.rss.sources[0].url=https://blog.myfitnesspal.com/feed/
app.rss.sources[1].name=mayhealthylifestyle
app.rss.sources[1].url=https://mayhealthylifestyle.com/feed/
#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Ollama AI
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.2
# Ollama defaults llama3.1 to a 2048-token window whatever the model card says, and silently
# truncates the prompt rather than failing. With retrieved passages in front of the question that
# drops the grounding first, so retrieval appears to do nothing at all. Set it explicitly.
spring.ai.ollama.chat.options.num-ctx=8192
# The output budget. Spring AI's `max-tokens` maps here, not to num-ctx; 400 was too tight once
# answers have to carry citations.
spring.ai.ollama.chat.options.num-predict=800
# Cross-lingual by requirement, not by preference: students write Greek, the NHS corpus is English.
spring.ai.ollama.embedding.options.model=bge-m3
spring.ai.ollama.connection-timeout=10s
# A cold model load on a first request costs far more than a warm generation.
spring.ai.ollama.read-timeout=600s
# Where the per-tenant embedding files are written, so a restart loads instead of re-embedding.
# Spring MVC gives an async request 30s by default on some containers and the streamed chat turn
# can legitimately exceed that on a cold model. The failure mode is a half-written response, so the
# ceiling is set well above the slowest realistic turn rather than close to it.
spring.mvc.async.request-timeout=660s
unihealth.ai.vector-store-path=./data/ai
unihealth.ai.top-k=6
unihealth.ai.max-message-chars=1000
unihealth.ai.similarity-threshold=0.3
# Live lookups at trusted health authorities (EODY, ECDC, WHO).
# Off by default: an installation opts in to outbound traffic rather than discovering it, and a
# deployment with no egress must still work. The allowlist is not configured here - it is the set of
# TrustedHealthSource implementations, so a property cannot widen it.
unihealth.ai.external.enabled=false
# Ceiling for the whole step: discovery, ranking and page reads, across all sources in parallel.
# Past this the answer is late enough that the local corpus plus an honest note serves better.
unihealth.ai.external.budget=3s
# Nothing older is offered as "recent". Covers a seasonal outbreak without dredging up last year's.
unihealth.ai.external.max-age-days=90
unihealth.ai.external.top-k=3
unihealth.ai.external.max-passage-chars=1200
# Below this best local similarity the corpus is treated as not covering the question, which is the
# second thing that can open the gate. Set from observed scores once there are some.
unihealth.ai.external.weak-coverage-score=0.45
unihealth.ai.external.max-lookups-per-hour=10
unihealth.ai.external.index-cache-ttl=30m
unihealth.ai.external.page-cache-ttl=24h
# Self-identifying, so an administrator who wants us to stop has an obvious way to say so.
unihealth.ai.external.user-agent=UniHealthBot/1.0 (+https://www.uniwa.gr; thesis project)
# Feed URLs are configurable because a public site may move one, and correcting it should not need a
# recompile. This is not a hole in the allowlist: every request is checked against the adapter's own
# hardcoded domain, so a wrong value here can only fail to fetch, never reach somewhere else.
# VERIFY each of these resolves, and check its robots.txt, before enabling the feature.
unihealth.ai.external.sources.eody-feed=https://eody.gov.gr/feed/
unihealth.ai.external.sources.ecdc-feed=https://www.ecdc.europa.eu/en/taxonomy/term/1522/feed
unihealth.ai.external.sources.who-feed=https://www.who.int/rss-feeds/news-english.xml
# A scanned lab result is well under 5 MB and a phone photo of one around 5 MB; 20 MB covers a
# multi-page TIFF scan with room to spare. The previous 500 MB was a denial-of-service invitation:
# both the virus scanner and the content-type detector read the whole stream before anything is
# stored.
spring.servlet.multipart.max-file-size=20MB
# The maximum upload permitted file size per request
spring.servlet.multipart.max-request-size=25MB
# Without this Tomcat aborts the connection once the limit is hit, so the browser sees a network
# error instead of the 413 the application wants to explain.
server.tomcat.max-swallow-size=25MB
# ClamAV
clamav-client.host=localhost
clamav-client.port=3310
# S3 Client
file-system.host=http://localhost:8333
s3-access.key=acces-key-123
s3-secret.key=secret-key-123
s3-bucket.name=-files-bucket
s3-region=us-east-1
