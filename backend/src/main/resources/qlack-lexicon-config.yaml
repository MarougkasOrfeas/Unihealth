      # Cookies policy page
      - cookies.page.eyebrow: LEGAL
      - cookies.page.title: Cookies and Usage Measurement Policy
      - cookies.page.subtitle: What is stored on your device, what we measure, and how you control it.
      - cookies.page.updated: "Last updated: September 2026"
      - cookies.section.noCookies.title: We use no tracking cookies
      - cookies.section.noCookies.body: UniHealth sets no tracking or advertising cookies and embeds no third-party analytics tools. You sign in with a token, not a session cookie.
      - cookies.section.necessary.title: Strictly necessary local storage
      - cookies.section.necessary.body: To keep you signed in, we store your sign-in tokens in your browser. We also use a short-lived message that is written and immediately removed, so that signing out in one tab signs you out in the others. The application cannot work without these, so they do not require consent.
      - cookies.section.functional.title: Functional local storage
      - cookies.section.functional.body: The UniHealth AI assistant remembers locally which welcome message it has already shown you, so it does not repeat itself. This never leaves your device and is not used to track anyone.
      - cookies.section.analytics.title: Optional usage measurement
      - cookies.section.analytics.body: If you give consent, we record how many seconds you spend reading content related to each health topic in your profile, and how many times you interact with it. The data is stored against your account, used only to improve the suggestions you see, and shared with no one. We measure health topics, not the content of your searches.
      - cookies.section.analytics.optIn: Measurement stays off until you explicitly accept it. If you reject it, absolutely nothing is recorded or sent.
      - cookies.section.control.title: You stay in control
      - cookies.section.control.body: You can give or withdraw consent at any time from your Profile, under Preferences. Withdrawing stops measurement immediately and permanently deletes all usage data collected for your account.
      - cookies.section.control.cta: Open preferences
      - cookies.section.contact.title: Questions
      - cookies.section.contact.body: For questions about your personal data, please contact the student support services of the University of West Attica.
