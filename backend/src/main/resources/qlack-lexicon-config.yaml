      - cookies.section.noCookies.title: Δεν χρησιμοποιούμε cookies παρακολούθησης
      - cookies.section.noCookies.body: Το UniHealth δεν τοποθετεί cookies παρακολούθησης ή διαφήμισης και δεν ενσωματώνει εργαλεία αναλυτικών τρίτων. Η σύνδεσή σου γίνεται με token και όχι με cookie συνεδρίας.
      - cookies.section.necessary.title: Απολύτως αναγκαία τοπική αποθήκευση
      - cookies.section.necessary.body: Για να παραμείνεις συνδεδεμένος, αποθηκεύουμε τα token σύνδεσης στον browser σου. Χρησιμοποιούμε επίσης ένα προσωρινό μήνυμα που γράφεται και διαγράφεται αμέσως, ώστε η αποσύνδεση σε μία καρτέλα να ισχύσει και στις υπόλοιπες. Χωρίς αυτά η εφαρμογή δεν λειτουργεί, οπότε δεν απαιτούν συγκατάθεση.
      - cookies.section.functional.title: Λειτουργική τοπική αποθήκευση
      - cookies.section.functional.body: Ο βοηθός UniHealth AI θυμάται τοπικά ποιο μήνυμα καλωσορίσματος σου έχει δείξει, για να μην το επαναλαμβάνει. Αυτή η πληροφορία δεν φεύγει ποτέ από τη συσκευή σου και δεν χρησιμοποιείται για παρακολούθηση.
      - cookies.section.analytics.title: Προαιρετικές μετρήσεις χρήσης
      - cookies.section.analytics.body: Αν δώσεις τη συγκατάθεσή σου, καταγράφουμε πόσα δευτερόλεπτα διαβάζεις περιεχόμενο σχετικό με κάθε θέμα υγείας του προφίλ σου και πόσες φορές αλληλεπιδράς με αυτό. Τα δεδομένα αποθηκεύονται στον λογαριασμό σου, χρησιμοποιούνται μόνο για να βελτιώνονται οι προτάσεις που βλέπεις, και δεν κοινοποιούνται σε τρίτους. Μετράμε θέματα υγείας, όχι το περιεχόμενο των αναζητήσεών σου.
      - cookies.section.analytics.optIn: Η μέτρηση είναι απενεργοποιημένη μέχρι να την αποδεχτείς ρητά. Αν την απορρίψεις, δεν καταγράφεται και δεν αποστέλλεται απολύτως τίποτα.
      - cookies.section.control.title: Ο έλεγχος είναι δικός σου
      - cookies.section.control.body: Μπορείς να δώσεις ή να ανακαλέσεις τη συγκατάθεσή σου όποτε θέλεις από το Προφίλ, στην ενότητα Προτιμήσεις. Η ανάκληση σταματά αμέσως τη μέτρηση και διαγράφει οριστικά όλα τα δεδομένα χρήσης που έχουν συλλεχθεί για τον λογαριασμό σου.
