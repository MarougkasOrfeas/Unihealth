<div class="dialog-header">
    <div class="dialog-icon">
        <mat-icon>{{ data.icon }}</mat-icon>
    </div>

    <div class="dialog-title-group">
        <p class="dialog-eyebrow">{{ data.sectionTitle }}</p>
        <h2 mat-dialog-title>{{ data.title }}</h2>
    </div>
</div>

<mat-dialog-content>
    <p class="dialog-brief">{{ data.brief }}</p>
    <p>{{ data.content }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button mat-dialog-close>{{ 'global.close' | translate }}</button>
</mat-dialog-actions>
