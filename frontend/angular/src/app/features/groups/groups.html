<app-page-header [title]="'group.management.title' | translate">
    <ng-container actions>
        <app-button icon="add" size="large" testId="btn-create" (clicked)="onCreate()">
            {{ 'group.management.action.create' | translate }}
        </app-button>
    </ng-container>
</app-page-header>

<app-base-table
    pageName="groups"
    [service]="groupService"
    [columns]="columns"
    [mapToRow]="toRow"
    [emptyState]="emptyState"
    [defaultSort]="['name,asc']"
    [rowActions]="['view', 'edit', 'delete']"
    [showExport]="true"
    [showImport]="true"
    [importDisabled]="true"
    [emptyStateCreate]="true"
    (create)="onCreate()"
    (view)="onView($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
/>
