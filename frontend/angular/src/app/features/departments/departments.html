<app-page-header [title]="'department.management.title' | translate">
    <ng-container actions>
        <app-button icon="add" size="large" testId="btn-create" (clicked)="onCreate()">
            {{ 'department.management.action.create' | translate }}
        </app-button>
    </ng-container>
</app-page-header>

<!-- No export: DepartmentController.getExportService() returns null, so POST /department/_export
     would answer with QDoesNotExistException. -->
<app-base-table
    pageName="departments"
    [service]="departmentService"
    [columns]="columns"
    [mapToRow]="toRow"
    [emptyState]="emptyState"
    [defaultSort]="['name,asc']"
    [rowActions]="['view', 'edit', 'delete']"
    [showExport]="false"
    [showImport]="true"
    [importDisabled]="true"
    [emptyStateCreate]="true"
    (create)="onCreate()"
    (view)="onView($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
/>
